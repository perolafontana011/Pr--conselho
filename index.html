<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pré-Conselho Escolar</title>
    <!-- Importando uma fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;       /* Roxo moderno */
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;     /* Azul claro */
            --success: #10b981;       /* Verde */
            --danger: #ef4444;        /* Vermelho */
            --background: #f3f4f6;    /* Cinza bem claro */
            --surface: #ffffff;       /* Branco */
            --text-main: #1f2937;     /* Cinza escuro */
            --text-muted: #6b7280;    /* Cinza médio */
            --border: #e5e7eb;        /* Borda suave */
            --radius: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { 
            background-color: var(--background); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px; 
            min-height: 100vh; 
            align-items: center; 
        }

        #app { 
            width: 100%; 
            max-width: 1000px; 
            background: var(--surface); 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-lg); 
            overflow: hidden; 
            position: relative;
        }

        /* Telas */
        .screen { display: none; padding: 40px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login */
        #login-screen { max-width: 450px; margin: 0 auto; box-shadow: none; background: transparent; padding: 0;}
        .login-box { 
            background: var(--surface); 
            padding: 40px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-lg); 
            border: 1px solid var(--border);
        }
        .login-box h1 { margin-bottom: 30px; color: var(--text-main); font-size: 1.75rem; text-align: center; font-weight: 700; }
        
        /* Abas de Login */
        .login-tabs { display: flex; margin-bottom: 30px; background: var(--background); padding: 5px; border-radius: 8px; }
        .login-tab { 
            flex: 1; 
            padding: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            color: var(--text-muted); 
            border-radius: 6px; 
            transition: all 0.3s ease; 
            text-align: center; 
            font-size: 0.95rem;
        }
        .login-tab:hover { color: var(--text-main); }
        .login-tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

        .login-form { display: none; text-align: left; }
        .login-form.active { display: block; animation: fadeIn 0.3s ease; }

        /* Formulários */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main); font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 1rem; 
            transition: all 0.2s ease;
            background: var(--surface);
            color: var(--text-main);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .form-group textarea { resize: vertical; min-height: 100px; }

        /* Botões */
        button { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: 600; 
            transition: all 0.2s ease; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--background); border-color: var(--text-muted); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; border-radius: 6px; }

        /* Header do Painel */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
            border-bottom: 1px solid var(--border);
        }
        .header h2 { color: var(--text-main); font-size: 1.5rem; font-weight: 700; }
        .user-info { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

        /* Menus de Abas */
        .admin-controls, .prof-controls { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .admin-controls button, .prof-controls button { flex: 1; min-width: 150px; }
        .aba-ativa { background: var(--primary) !important; color: white !important; box-shadow: var(--shadow-md); }

        /* Caixas de Seção */
        .section-box { 
            background: var(--background); 
            padding: 25px; 
            border-radius: var(--radius); 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
        }
        .section-box h3 { margin-bottom: 20px; color: var(--text-main); font-size: 1.1rem; font-weight: 600; }

        /* Lista de Perguntas Admin */
        .pergunta-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--surface); 
            padding: 15px 20px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            margin-bottom: 12px; 
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }
        .pergunta-item:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
        .pergunta-item span { flex: 1; font-size: 0.95rem; color: var(--text-main); line-height: 1.4; }
        
        /* Área do Professor */
        .pergunta-bloco { 
            margin-bottom: 25px; 
            background: var(--surface); 
            padding: 25px; 
            border-radius: var(--radius); 
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary); 
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }
        .pergunta-bloco:hover { box-shadow: var(--shadow-md); }
        .pergunta-bloco label { font-weight: 600; display: block; margin-bottom: 12px; color: var(--text-main); font-size: 1rem; line-height: 1.5; }
        
        /* Mensagens */
        .hidden { display: none !important; }
        .msg { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
        .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* Impressão (Apenas Admin) */
        @media print {
            body { background: white; padding: 0; display: block; }
            #app { box-shadow: none; max-width: 100%; border-radius: 0; }
            .no-print { display: none !important; }
            .screen { padding: 0; }
            .section-box { border: none; padding: 0; background: white; }
            .pergunta-bloco { border-left: none; border-bottom: 1px solid #ccc; border-radius: 0; padding: 15px 0; box-shadow: none; }
            .admin-controls { display: none !important; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>Pré-Conselho Escolar</h1>
            
            <!-- Abas de Login -->
            <div class="login-tabs">
                <div class="login-tab active" onclick="mudarAbaLogin('admin')">Sou Administrador</div>
                <div class="login-tab" onclick="mudarAbaLogin('professor')">Sou Professor</div>
            </div>

            <!-- Formulário Admin -->
            <div id="form-login-admin" class="login-form active">
                <div id="login-msg-admin" class="msg hidden"></div>
                <div class="form-group">
                    <label>E-mail do Administrador</label>
                    <input type="email" id="admin-user" placeholder="admin@escola.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="admin-pass" placeholder="******">
                </div>
                <button class="btn-primary" onclick="fazerLogin('admin')">Entrar como Administrador</button>
                <p style="margin-top:20px; font-size:0.85rem; color:var(--text-muted); text-align:center;">Padrão: admin@escola.com / 123</p>
            </div>

            <!-- Formulário Professor -->
            <div id="form-login-professor" class="login-form">
                <div id="login-msg-prof" class="msg hidden"></div>
                <div class="form-group">
                    <label>E-mail do Professor</label>
                    <input type="email" id="prof-user" placeholder="professor@escola.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="prof-pass" placeholder="******">
                </div>
                <button class="btn-primary" onclick="fazerLogin('professor')">Entrar como Professor</button>
                <p style="margin-top:20px; font-size:0.85rem; color:var(--text-muted); text-align:center;">Padrão: professor@escola.com / 123</p>
            </div>
        </div>
    </div>

    <!-- TELA DO PROFESSOR -->
    <div id="professor-screen" class="screen">
        <div class="header no-print">
            <h2>Olá, <span id="prof-nome"></span> <span style="font-size: 1rem; color: var(--text-muted); font-weight: 500;">(Turma: <span id="prof-turma"></span>)</span></h2>
            <button class="btn-outline" onclick="logout()">Sair</button>
        </div>
        
        <div class="prof-controls no-print">
            <button id="btn-aba-responder" class="btn-primary" onclick="mostrarAbaProfessor('responder')">Responder Formulário</button>
            <button id="btn-aba-historico" class="btn-outline" onclick="mostrarAbaProfessor('historico')">Meu Histórico</button>
        </div>

        <!-- Aba: Responder Formulário -->
        <div id="aba-prof-responder" class="aba-prof-content">
            <div id="prof-msg" class="msg hidden no-print"></div>
            <form id="form-professor" onsubmit="salvarRespostas(event)">
                <div id="perguntas-container"></div>
                <button type="submit" class="btn-primary no-print" style="margin-top:30px; max-width: 300px; margin-left: auto; margin-right: auto;">Salvar Respostas</button>
            </form>
        </div>

        <!-- Aba: Histórico do Professor -->
        <div id="aba-prof-historico" class="aba-prof-content hidden">
            <div id="historico-container"></div>
        </div>
    </div>

    <!-- TELA DO ADMINISTRADOR -->
    <div id="admin-screen" class="screen">
        <div class="header no-print">
            <h2>Painel do Administrador</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span class="user-info">Logado como Admin</span>
                <button class="btn-outline" onclick="logout()">Sair</button>
            </div>
        </div>

        <div class="admin-controls no-print">
            <button id="btn-aba-gerenciar" class="btn-primary" onclick="mostrarAbaAdmin('gerenciar-perguntas')">Gerenciar Perguntas</button>
            <button id="btn-aba-cadastrar" class="btn-outline" onclick="mostrarAbaAdmin('cadastrar-prof')">Cadastrar Professor</button>
            <button id="btn-aba-respostas" class="btn-outline" onclick="mostrarAbaAdmin('ver-respostas')">Ver Respostas</button>
            <button class="btn-success" onclick="window.print()">Imprimir / PDF</button>
        </div>

        <!-- Aba: Gerenciar Perguntas -->
        <div id="aba-gerenciar-perguntas" class="aba-admin-content">
            <div class="section-box no-print">
                <h3>Adicionar Nova Pergunta</h3>
                <div class="form-group">
                    <input type="text" id="nova-pergunta-texto" placeholder="Digite a pergunta aqui...">
                </div>
                <button class="btn-primary" style="max-width: 250px;" onclick="adicionarPergunta()">Adicionar Pergunta</button>
            </div>
            <div class="section-box">
                <h3>Perguntas Ativas</h3>
                <div id="lista-perguntas-admin"></div>
            </div>
        </div>

        <!-- Aba: Cadastrar Professor -->
        <div id="aba-cadastrar-prof" class="aba-admin-content hidden">
            <div class="section-box">
                <h3>Cadastrar Novo Professor</h3>
                <div class="form-group">
                    <label>Nome do Professor</label>
                    <input type="text" id="prof-nome-cad" placeholder="Ex: João Silva">
                </div>
                <div class="form-group">
                    <label>E-mail (Login)</label>
                    <input type="email" id="prof-email-cad" placeholder="professor@escola.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="text" id="prof-senha-cad" placeholder="Senha de acesso">
                </div>
                <div class="form-group">
                    <label>Turma que leciona</label>
                    <select id="prof-turma-cad">
                        <option value="6º Ano A">6º Ano A</option>
                        <option value="6º Ano B">6º Ano B</option>
                        <option value="7º Ano A">7º Ano A</option>
                        <option value="8º Ano A">8º Ano A</option>
                        <option value="9º Ano A">9º Ano A</option>
                    </select>
                </div>
                <button class="btn-success" style="max-width: 250px;" onclick="cadastrarProfessor()">Cadastrar Professor</button>
            </div>
        </div>

        <!-- Aba: Ver Respostas -->
        <div id="aba-ver-respostas" class="aba-admin-content hidden">
            <div class="section-box no-print">
                <h3>Filtrar Respostas</h3>
                <div class="form-group" style="max-width: 300px;">
                    <label>Selecione a Turma:</label>
                    <select id="filtro-turma" onchange="renderizarRespostasAdmin()">
                        <option value="Todas">Todas as Turmas</option>
                        <option value="6º Ano A">6º Ano A</option>
                        <option value="6º Ano B">6º Ano B</option>
                        <option value="7º Ano A">7º Ano A</option>
                        <option value="8º Ano A">8º Ano A</option>
                        <option value="9º Ano A">9º Ano A</option>
                    </select>
                </div>
            </div>
            <div id="respostas-container"></div>
        </div>
    </div>
</div>

<script>
    // --- BANCO DE DADOS SIMULADO (LOCALSTORAGE) ---
    const DB = {
        get: (key) => JSON.parse(localStorage.getItem(key)) || [],
        set: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
        
        init: () => {
            let usuarios = DB.get('usuarios');
            
            // Garante que o Admin existe
            if (!usuarios.find(u => u.email === 'admin@escola.com')) {
                usuarios.push({ id: 1, nome: 'Administrador', email: 'admin@escola.com', senha: '123', tipo: 'admin' });
            }
            
            // Garante que o Professor de teste existe
            if (!usuarios.find(u => u.email === 'professor@escola.com')) {
                usuarios.push({ id: 2, nome: 'Prof. Exemplo', email: 'professor@escola.com', senha: '123', tipo: 'professor', turma: '6º Ano A' });
            }
            
            DB.set('usuarios', usuarios);

            // Cria perguntas padrão se não existirem
            if (!localStorage.getItem('perguntas')) {
                DB.set('perguntas', [
                    { id: 1, texto: "Como você avalia o desenvolvimento geral da turma em relação à aprendizagem?" },
                    { id: 2, texto: "Como está a participação, o envolvimento e a postura dos estudantes nas aulas?" },
                    { id: 3, texto: "Quais habilidades/conteúdos apresentam maior dificuldade para a turma?" },
                    { id: 4, texto: "Há estudantes com baixa frequência ou que necessitam de acompanhamento mais próximo? Quais e por quê?" },
                    { id: 5, texto: "Estudantes que se destacaram positivamente (aprendizagem, participação, responsabilidade ou protagonismo):" },
                    { id: 6, texto: "Estudantes que apresentam dificuldades significativas ou necessitam de intervenção/encaminhamento:" },
                    { id: 7, texto: "Quais estratégias já foram realizadas e quais ações você sugere para o próximo período?" },
                    { id: 8, texto: "Há alguma observação importante que deve ser registrada no Pré-Conselho?" },
                    { id: 9, texto: "Deixe aqui uma observação geral sobre a turma e/ou sobre algum estudante que considere relevante para o Conselho de Classe:" }
                ]);
            }
            if (!localStorage.getItem('respostas')) {
                DB.set('respostas', []);
            }
        }
    };

    let usuarioLogado = null;

    // --- INICIALIZAÇÃO ---
    DB.init();

    // --- FUNÇÕES DE LOGIN ---
    function mudarAbaLogin(tipo) {
        document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        
        document.getElementById('form-login-' + tipo).classList.add('active');
        
        if (tipo === 'admin') {
            document.querySelector('.login-tab:nth-child(1)').classList.add('active');
        } else {
            document.querySelector('.login-tab:nth-child(2)').classList.add('active');
        }
    }

    function fazerLogin(tipo) {
        let email, senha, msgId;
        
        if (tipo === 'admin') {
            email = document.getElementById('admin-user').value;
            senha = document.getElementById('admin-pass').value;
            msgId = 'login-msg-admin';
        } else {
            email = document.getElementById('prof-user').value;
            senha = document.getElementById('prof-pass').value;
            msgId = 'login-msg-prof';
        }

        const msg = document.getElementById(msgId);
        const usuarios = DB.get('usuarios');
        const user = usuarios.find(u => u.email === email && u.senha === senha);

        if (user) {
            if (user.tipo !== tipo) {
                msg.innerText = `Esta conta é de ${user.tipo}. Por favor, use a aba correta.`;
                msg.className = "msg msg-error";
                msg.classList.remove('hidden');
                return;
            }

            usuarioLogado = user;
            msg.classList.add('hidden');
            document.getElementById('login-screen').classList.remove('active');
            
            if (user.tipo === 'admin') {
                document.getElementById('admin-screen').classList.add('active');
                mostrarAbaAdmin('gerenciar-perguntas');
            } else {
                document.getElementById('professor-screen').classList.add('active');
                document.getElementById('prof-nome').innerText = user.nome;
                document.getElementById('prof-turma').innerText = user.turma;
                mostrarAbaProfessor('responder');
            }
        } else {
            msg.innerText = "E-mail ou senha incorretos!";
            msg.className = "msg msg-error";
            msg.classList.remove('hidden');
        }
    }

    function logout() {
        usuarioLogado = null;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('login-screen').classList.add('active');
        
        document.getElementById('admin-user').value = '';
        document.getElementById('admin-pass').value = '';
        document.getElementById('prof-user').value = '';
        document.getElementById('prof-pass').value = '';
        
        document.querySelectorAll('.msg').forEach(m => m.classList.add('hidden'));
        mudarAbaLogin('admin');
    }

    // --- NAVEGAÇÃO DO PROFESSOR ---
    function mostrarAbaProfessor(aba) {
        document.querySelectorAll('.aba-prof-content').forEach(el => el.classList.add('hidden'));
        document.getElementById('aba-prof-' + aba).classList.remove('hidden');

        const btnResponder = document.getElementById('btn-aba-responder');
        const btnHistorico = document.getElementById('btn-aba-historico');
        
        if (aba === 'responder') {
            btnResponder.className = 'btn-primary aba-ativa';
            btnHistorico.className = 'btn-outline';
            carregarFormularioProfessor();
        } else {
            btnResponder.className = 'btn-outline';
            btnHistorico.className = 'btn-primary aba-ativa';
            renderizarHistoricoProfessor();
        }
    }

    // --- NAVEGAÇÃO DO ADMIN ---
    function mostrarAbaAdmin(abaId) {
        document.querySelectorAll('.aba-admin-content').forEach(aba => aba.classList.add('hidden'));
        document.getElementById('aba-' + abaId).classList.remove('hidden');
        
        document.querySelectorAll('.admin-controls button').forEach(btn => btn.className = 'btn-outline');
        if(abaId === 'gerenciar-perguntas') document.getElementById('btn-aba-gerenciar').className = 'btn-primary aba-ativa';
        if(abaId === 'cadastrar-prof') document.getElementById('btn-aba-cadastrar').className = 'btn-primary aba-ativa';
        if(abaId === 'ver-respostas') document.getElementById('btn-aba-respostas').className = 'btn-primary aba-ativa';

        if (abaId === 'gerenciar-perguntas') renderizarPerguntasAdmin();
        if (abaId === 'ver-respostas') renderizarRespostasAdmin();
    }

    // --- FUNÇÕES DO ADMINISTRADOR ---
    function adicionarPergunta() {
        const texto = document.getElementById('nova-pergunta-texto').value.trim();
        if (!texto) return alert("Digite o texto da pergunta.");

        const perguntas = DB.get('perguntas');
        perguntas.push({ id: Date.now(), texto: texto });
        DB.set('perguntas', perguntas);
        
        document.getElementById('nova-pergunta-texto').value = '';
        renderizarPerguntasAdmin();
    }

    function excluirPergunta(id) {
        if (!confirm("Tem certeza que deseja excluir esta pergunta?")) return;
        let perguntas = DB.get('perguntas');
        perguntas = perguntas.filter(p => p.id !== id);
        DB.set('perguntas', perguntas);
        renderizarPerguntasAdmin();
    }

    function renderizarPerguntasAdmin() {
        const container = document.getElementById('lista-perguntas-admin');
        const perguntas = DB.get('perguntas');
        container.innerHTML = '';

        if (perguntas.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted);">Nenhuma pergunta cadastrada.</p>';
            return;
        }

        perguntas.forEach(p => {
            const div = document.createElement('div');
            div.className = 'pergunta-item';
            div.innerHTML = `
                <span>${p.texto}</span>
                <div class="no-print">
                    <button class="btn-danger btn-sm" onclick="excluirPergunta(${p.id})">Excluir</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function cadastrarProfessor() {
        const nome = document.getElementById('prof-nome-cad').value.trim();
        const email = document.getElementById('prof-email-cad').value.trim();
        const senha = document.getElementById('prof-senha-cad').value.trim();
        const turma = document.getElementById('prof-turma-cad').value;

        if (!nome || !email || !senha) return alert("Preencha todos os campos!");

        const usuarios = DB.get('usuarios');
        if (usuarios.find(u => u.email === email)) return alert("Este e-mail já está cadastrado!");

        usuarios.push({ id: Date.now(), nome, email, senha, tipo: 'professor', turma });
        DB.set('usuarios', usuarios);

        alert("Professor cadastrado com sucesso!");
        document.getElementById('prof-nome-cad').value = '';
        document.getElementById('prof-email-cad').value = '';
        document.getElementById('prof-senha-cad').value = '';
    }

    function renderizarRespostasAdmin() {
        const container = document.getElementById('respostas-container');
        const filtroTurma = document.getElementById('filtro-turma').value;
        const respostas = DB.get('respostas');
        const perguntas = DB.get('perguntas');

        let respostasFiltradas = respostas;
        if (filtroTurma !== 'Todas') {
            respostasFiltradas = respostas.filter(r => r.turma === filtroTurma);
        }

        if (respostasFiltradas.length === 0) {
            container.innerHTML = '<div class="section-box"><p style="color: var(--text-muted);">Nenhuma resposta enviada para esta turma ainda.</p></div>';
            return;
        }

        container.innerHTML = '';
        
        const agrupado = {};
        respostasFiltradas.forEach(r => {
            const chave = `${r.professorNome} - ${r.turma}`;
            if (!agrupado[chave]) agrupado[chave] = [];
            agrupado[chave].push(r);
        });

        for (const [chave, listaRespostas] of Object.entries(agrupado)) {
            const divBloco = document.createElement('div');
            divBloco.className = 'section-box';
            
            let html = `<h3 style="border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px;">Professor(a): ${listaRespostas[0].professorNome} | Turma: ${listaRespostas[0].turma}</h3>`;
            html += `<p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Data de envio: ${new Date(listaRespostas[0].data).toLocaleString()}</p>`;

            listaRespostas.forEach(r => {
                const perguntaObj = perguntas.find(p => p.id === r.perguntaId);
                const textoPergunta = perguntaObj ? perguntaObj.texto : `[Pergunta excluída: ${r.perguntaId}]`;
                
                html += `
                    <div style="margin-bottom: 20px; background: var(--surface); padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); box-shadow: var(--shadow-sm);">
                        <p style="font-weight: 600; color: var(--text-main); font-size: 0.95rem; margin-bottom: 5px;">${textoPergunta}</p>
                        <p style="font-size: 1rem; color: var(--text-main); line-height: 1.5;">${r.resposta || '<em style="color: var(--text-muted);">Não respondido</em>'}</p>
                    </div>
                `;
            });
            divBloco.innerHTML = html;
            container.appendChild(divBloco);
        }
    }

    // --- FUNÇÕES DO PROFESSOR ---
    function carregarFormularioProfessor() {
        const container = document.getElementById('perguntas-container');
        const perguntas = DB.get('perguntas');
        const respostas = DB.get('respostas');
        
        container.innerHTML = '';
        document.getElementById('prof-msg').classList.add('hidden');

        if (perguntas.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted);">Nenhuma pergunta disponível no momento.</p>';
            return;
        }

        const respostasDoProf = respostas.filter(r => r.professorId === usuarioLogado.id);

        perguntas.forEach(p => {
            const respostaAntiga = respostasDoProf.find(r => r.perguntaId === p.id);
            const valor = respostaAntiga ? respostaAntiga.resposta : '';

            const div = document.createElement('div');
            div.className = 'pergunta-bloco';
            div.innerHTML = `
                <label>${p.texto}</label>
                <textarea id="resp-${p.id}" rows="4" placeholder="Digite sua resposta...">${valor}</textarea>
            `;
            container.appendChild(div);
        });
    }

    function salvarRespostas(e) {
        e.preventDefault();
        const perguntas = DB.get('perguntas');
        let respostas = DB.get('respostas');
        const msg = document.getElementById('prof-msg');

        respostas = respostas.filter(r => r.professorId !== usuarioLogado.id);

        perguntas.forEach(p => {
            const textoResposta = document.getElementById(`resp-${p.id}`).value.trim();
            respostas.push({
                id: Date.now() + Math.random(),
                professorId: usuarioLogado.id,
                professorNome: usuarioLogado.nome,
                turma: usuarioLogado.turma,
                perguntaId: p.id,
                resposta: textoResposta,
                data: new Date().toISOString()
            });
        });

        DB.set('respostas', respostas);

        msg.innerText = "Respostas salvas com sucesso!";
        msg.className = "msg msg-success";
        msg.classList.remove('hidden');
        
        setTimeout(() => { msg.classList.add('hidden'); }, 3000);
    }
